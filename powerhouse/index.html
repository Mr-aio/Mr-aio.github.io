    for (const d of rows) {
      if (S.bgone && S.bgone[d.id]) { syncDelete(d); continue; }   // removed on this phone
      let inc = null; try { inc = bDecode('PH2:' + d.code); } catch (e) { }
      if (!inc || inc.id !== d.id) continue;
      const res = importBattle(inc, { sync: true, ouid: d.uids.find(u => u !== uid) });
      if (!res) continue;
      res.b.seen = Date.now(); res.b.exp = d.expires;
      if (res.changed) news.push(res);
      if (res.finishedNow && d.done) syncDelete(d);
      // 30 days without a move: close it on both phones and delete the shared copy.
      else if (!d.done && d.expires && d.expires < Date.now()) { if (!bOver(res.b)) { res.b.closed = 'expired'; save(); } syncDelete(d); }
    }
    // A battle that synced before but is gone now was removed by the friend (or expired): close it here too.
    if (rows.length < LIM) for (const b of Object.values(bStore()))
      if (b.ouid && !b.closed && !bOver(b) && bSide(b) >= 0 && !seen.has(b.id) && Math.max(b.synced || 0, b.seen || 0) && Math.max(b.synced || 0, b.seen || 0) < t0) {
        b.closed = b.exp && Date.now() > b.exp ? 'expired' : 'left'; save();
        if (b.closed === 'left') news.push({ b, closed: true });
      }
    for (const b of Object.values(bStore())) if (b.dirty && b.ouid && !b.closed && bSide(b) >= 0) await syncPush(b);
    Sync.err = null; Sync.ok = Date.now();
  } catch (e) { Sync.err = String(e.message || e); }
  finally { Sync.busy = false; }
  syncShowStatus();
  if (news.length) syncNotice(news);
}
function syncStatusHtml() {
  if (!Sync.on || !me().name) return '';
  if (Sync.err) return `<p class="small bt-syncst bad" id="btSync">Battle sync isn't connecting (${esc(Sync.err)}). Battles still work by link.</p>`;
  return `<p class="small muted bt-syncst" id="btSync">${Sync.ok ? ICON.check + 'Battle sync is on' : 'Checking battle sync…'}</p>`;
}
function syncShowStatus() { const el = $('#btSync'); if (el) el.outerHTML = syncStatusHtml(); }
function syncNotice(items) {
  const top = stack[stack.length - 1], playing = top && SCREENS[top.name].play;
  if (playing) return;
  items.slice(0, 2).forEach(({ b, isNew, closed }) => {
    const o = bOpp(b), n = bNext(b), on = o ? o.n : 'Your friend';
    if (closed) toast(on + ' left your battle', 'It’s moved to Finished.', 'VS');
    else if (n.t === 'play' || n.t === 'pick') toast(isNew ? (bSide(b) === 0 ? on + ' took your challenge' : on + ' started a battle') : on + ' played their turn', 'Your move', 'VS');
    else if (n.t === 'over') toast('Battle with ' + on + ' is over', b.awarded === 'win' ? 'You won!' : b.awarded === 'loss' ? on + ' won' : 'It’s a tie', 'VS');
  });
  SFX.play('badge'); hap('badge');
  const typing = document.activeElement && document.activeElement.matches('textarea, input');
  if (top && ['home', 'battles', 'battle'].includes(top.name) && !typing && $('#modal').hidden) render(false);
}
function syncStart() {
  if (!Sync.on) return;
  // Firebase's free plan has a daily read quota, so only check when something could arrive, check less
  // often away from the battle screens, and not at all mid-round (nothing would be shown anyway).
  const anything = () => Object.keys(S.friends || {}).length || Object.values(bStore()).some(b => !b.closed && !bOver(b));
  setTimeout(() => { if (anything()) syncPoll(true); }, 800);
  setInterval(() => {
    if (document.hidden || !anything()) return;
    const top = stack[stack.length - 1], name = top && top.name;
    if (name && SCREENS[name] && SCREENS[name].play) return;
    if (Date.now() - Sync.last >= (['battles', 'battle'].includes(name) ? 12000 : 45000)) syncPoll(true);
  }, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPoll(true); });
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.closest('#modal') || t.closest('#reader')) return;
  const d = t.dataset;
  if (S.set.sound) SFX.init();
  if ('back' in d) { SFX.play('tap'); hap('tap'); return back(); }
  if (d.go) { SFX.play('tap'); hap('tap'); return go(d.go, { ch: d.ch ? +d.ch : undefined, sec: d.sec }); }
  if (d.opt !== undefined) return answer(+d.opt, t);
  if (d.tf !== undefined) return sprintAnswer(d.tf === '1');
  if (d.side) return matchTap(t);
  if (d.seq !== undefined) return seqTap(t);
  if (d.themeSet) { S.set.theme = d.themeSet; save(); applyTheme(); $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === S.set.theme)); return; }
  if (d.toggle) {
    S.set[d.toggle] = S.set[d.toggle] === false; save(); t.setAttribute('aria-checked', S.set[d.toggle]);
    if (S.set[d.toggle]) {
      if (d.toggle === 'haptics') hap('fire');
      if (d.toggle === 'sound') { SFX.init(); SFX.play('right', 5); }
      if (d.toggle === 'fx') { const [x, y] = center(t); FX.burst(x, y, { n: 24, cols: [tok('--good'), tok('--atp'), tok('--accent')], spd: [120, 360], size: [2, 4.5], g: 500, life: [0.4, 0.8] }); Shake.go(6, 0.3); }
    }
    return;
  }
  const top = stack[stack.length - 1].params;
  switch (d.act) {
    case 'mito': {
      bump(t, 'giggle'); SFX.play('giggle'); hap('giggle');
      const [x, y] = center(t);
      FX.burst(x, y - 8, { n: 16, cols: [tok('--mito'), tok('--atp'), tok('--accent')], spd: [120, 300], size: [2, 4], g: 420, life: [0.4, 0.8], dir: -Math.PI / 2, spread: Math.PI * 1.3 });
      FX.ring(x, y, tok('--mito'), 60, 0.4, 4);
      const f = pick(FACTS), box = $('.fact');
      if (box) { box.innerHTML = `<p>${esc(f[1])}</p><p class="small">From chapter ${f[0]}, ${esc(WORLD[f[0]].short)}</p>`; bump(box, 'swap'); }
      return;
    }
    case 'read': return openReader(d.topic, d.q);
    case 'drillTopic': return drillTopic(d.topic);
    case 'drillSec': return drillSection(d.sec);
    case 'drillWeak': return drillWeak();
    case 'secSort': S.secSort = d.v; save(); SFX.play('select'); return render(false);
    case 'weakCh': S.weakCh = +d.v; save(); SFX.play('select'); return render(false);
    case 'daily': return startQuiz({ kind: 'daily', ch: 0, ids: pickDaily() });
    case 'review': {
      if (!reviewCount()) return toast('Nothing to review yet', 'Questions you miss land here until you get them right twice.');
      return startQuiz({ kind: 'review', ch: 0, ids: pickReview() });
    }
    case 'level': { const sec = d.sec; return startQuiz({ kind: 'level', ch: +sec.split('.')[0], sec, ids: pickLevel(sec) }); }
    case 'boss': return startQuiz({ kind: 'boss', ch: +d.ch, ids: shuffle(CH[+d.ch].ids) });
    case 'sprint': return startSprint(+d.ch || 0);
    case 'sprintGo': return sprintStart();
    case 'sprintAgain': return startSprint(sprint.ch, true);
    case 'match': return startMatch(+d.ch, +d.i);
    case 'seq': return startSeq(+d.ch, +d.i);
    case 'gameAgain': return game.type === 'm' ? startMatch(game.ch, game.i, true) : startSeq(game.ch, game.i, true);
    case 'battleNew': return startNewBattle();
    case 'battleNudge': return bNudge(bStore()[d.id]);
    case 'battleRetry': { const bb = bStore()[d.id]; if (bb) { delete bb.syncFail; render(false); syncPush(bb).then(() => render(false)); } return; }
    case 'battleOpen': return go('battle', { id: d.id });
    case 'battlePick': return pickRound(bStore()[d.id], +d.c);
    case 'battlePlay': return playRound(bStore()[d.id]);
    case 'battleSend': return bShare(bStore()[d.id]);
    case 'battleRematch': return rematch(bStore()[d.id]);
    case 'battlePaste': return pasteBattle();
    case 'battleOpenText': { const ta = $('#btPaste'); return openBattleText(ta ? ta.value : ''); }
    case 'battleName': return askName();
    case 'battleDel': { const bb = bStore()[d.id], live = bb && Sync.on && bb.ouid && !bb.closed && !bOver(bb), on = bb && bOpp(bb) ? bOpp(bb).n : 'Your friend';
      return confirmBox('Remove this battle?', live ? 'It ends the battle for both of you. ' + on + ' will see that you left.' : 'It disappears from this phone. Your friend keeps their copy.', 'Remove', () => { if (live) syncForget(bb); delete bStore()[d.id]; save(); back(); }, true); }
    case 'next': return nextQ();
    case 'quit': return (stack[stack.length - 1].name === 'sprint' && !sprint.running) ? back() : askQuit();
    case 'again': {
      const k = sess.kind;
      if (k === 'level') return startQuiz({ kind: 'level', ch: sess.ch, sec: sess.sec, ids: pickLevel(sess.sec) }, true);
      if (k === 'boss') return startQuiz({ kind: 'boss', ch: sess.ch, ids: shuffle(CH[sess.ch].ids) }, true);
      if (k === 'daily') return startQuiz({ kind: 'daily', ch: 0, ids: pickDaily() }, true);
      if (k === 'drill') return startDrill(sess.tids, sess.title, true);
      if (!reviewCount()) { toast('All clear', 'No review cards left.'); return back(); }
      return startQuiz({ kind: 'review', ch: 0, ids: pickReview() }, true);
    }
    case 'reset': return confirmBox('Reset all progress?', 'This clears your ATP, stars, badges, streaks and review cards on this device. It can’t be undone.', 'Reset', () => {
      const keep = S.set, who = S.me; S = DEF(); S.set = keep; if (who) S.me = who; save(); go('home', {}, { reset: true }); toast('Progress reset', 'Fresh start. Mito is ready.');
    }, true);
  }
  void top;
});
document.addEventListener('keydown', e => {
  const top = stack[stack.length - 1]; if (!top) return;
  if (e.key === 'Escape') { if (!window.appBack()) { /* at home */ } return; }
  if (readerOpen()) return;
  if (top.name === 'quiz' && sess && !sess.answered && /^[1-4a-dA-D]$/.test(e.key)) {
    const j = /[1-4]/.test(e.key) ? +e.key - 1 : 'abcd'.indexOf(e.key.toLowerCase());
    const b = $$('.opt')[j]; if (b) answer(+b.dataset.opt, b);
  } else if (top.name === 'quiz' && sess && sess.answered && e.key === 'Enter' && document.activeElement && !document.activeElement.matches('button')) nextQ();
  else if (top.name === 'sprint' && sprint && sprint.running) {
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 't') sprintAnswer(true);
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'f') sprintAnswer(false);
  }
});
window.addEventListener('resize', () => { if (scope.cv) scope.mount(sess ? sess.streak : 0); });

/* ================= boot ================= */
// Clear data left on the device by earlier versions.
if (S.book) { delete S.book; save(); }
try { indexedDB.deleteDatabase('powerhouse-book'); } catch (e) { }
FX.init();
applyTheme();
if (S.rankIdx === undefined) S.rankIdx = rankInfo().idx;
go('home');
window.onSharedText = t => receiveShared(t);
try { if (window.Android && Android.takeSharedText) { const t = Android.takeSharedText(); if (t) setTimeout(() => receiveShared(t), 300); } } catch (e) { }
window.PH_battleCode = id => bStore()[id] ? bEncode(bStore()[id]) : null;
window.PH_battleMsg = id => bStore()[id] ? bMessage(bStore()[id]) : null;
window.PH_syncNow = () => syncPoll(true);
syncStart();
// Opened from a battle link in a browser: the page arrives as .../#b=CODE
const takeHash = () => { const h = location.hash; if (!/^#bw?=/.test(h)) return; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } setTimeout(() => linkArrival(h), 300); };
takeHash(); window.addEventListener('hashchange', takeHash);
})();
</script>
