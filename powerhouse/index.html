:root{
  /* Layout: one phone-width column. Chapters sit in a 3-up tray of circular slide fields;
     every quiz runs under a live membrane-potential trace that fires at threshold. */
  --bg:#FAF1F5; --surface:#FFFFFF; --sunk:#F3E6ED; --line:#E7D5DF;
  --ink:#25173A; --muted:#6C5D7E;
  --primary:#4A37A8; --on-primary:#FFFFFF; --primary-soft:#E9E4FB;
  --accent:#D63A74; --atp:#A86700; --atp-soft:#FBEBCF;
  --good:#0B8460; --good-soft:#DCF2E8; --bad:#C22B3B; --bad-soft:#FBE2E6;
  --mito:#E0507F; --mito-in:#FFD5E3; --mito-face:#3B1431; --mito-cristae:#F59BB8;
  --scope-bg:#FFF8FA; --grid:#F6D0DB; --thr:#B48AA0; --trace:#25173A; --glow:0;
  --shadow:0 1px 0 rgba(37,23,58,.05), 0 10px 24px -14px rgba(37,23,58,.45);
  --tf-s:72%; --tf-l:93%; --ti-s:50%; --ti-l:36%;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:26px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}

  --tf-s:42%; --tf-l:15%; --ti-s:90%; --ti-l:73%;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
svg{display:block}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px 32px}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.screen.enter .col{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- shared bits ---------- */
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink);flex:none}
.icon-btn:active{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;
  font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.005em}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
.muted{color:var(--muted)}
.small{font-size:14px}
.h2{font-size:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head .small{color:var(--muted)}
.stars{display:inline-flex;gap:2px;color:var(--atp)}
.stars svg{width:16px;height:16px}
.stars .off{color:var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:52px}
.bar .bar-title{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.pill svg{width:20px;height:20px}
.pill.atp{color:var(--atp)}
.pill.atp b{color:var(--ink)}
.pill.sun{color:var(--accent)}
.pill.sun span{color:var(--ink)}
.topbar .icon-btn{margin-left:auto}

.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.rank-line{display:flex;flex-direction:column;gap:6px}
.rank-name{font-size:34px}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--atp))}
.fact{grid-column:1 / -1;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.fact::before{content:"";position:absolute;left:34px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--surface)}
.fact p{font-size:16px}
.fact .small{margin-top:6px;color:var(--muted)}

.cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r-lg);background:var(--primary);color:var(--on-primary);text-align:left}
.cta .cta-t{font-family:var(--display);font-weight:800;font-size:22px;display:block}
.cta .cta-s{font-size:14px;opacity:.85;display:block}
.cta .cta-go{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.cta.done{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cta.done .cta-go{background:var(--good-soft);color:var(--good)}
.cta svg{width:22px;height:22px}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);text-align:left;min-height:84px}
.mode b{font-family:var(--display);font-weight:800;font-size:18px}
.mode span{font-size:14px;color:var(--muted)}
.mode .count{color:var(--accent);font-weight:700}

.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.slide{--c-fill:hsl(var(--h) var(--tf-s) var(--tf-l));--c-ink:hsl(var(--h) var(--ti-s) var(--ti-l));
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.field{position:relative;width:100%;max-width:112px;aspect-ratio:1}
.field .ring{position:absolute;inset:0;width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--line);stroke-width:5}
.ring-fg{fill:none;stroke:var(--c-ink);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.field .lens{position:absolute;inset:9%;border-radius:50%;background:var(--c-fill);display:grid;place-items:center;color:var(--c-ink);overflow:hidden}
.field .lens svg{width:78%;height:78%}
.slide:active .lens{filter:brightness(.96)}
.slide-label{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.15;text-wrap:balance}
.slide-label i{font-style:normal;color:var(--muted);margin-right:3px;font-variant-numeric:tabular-nums}
.slide-pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}

/* ---------- world ---------- */
.world-hero{--c-fill:hsl(var(--h) var(--tf-s) var(--tf-l));--c-ink:hsl(var(--h) var(--ti-s) var(--ti-l));
  display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.world-hero .field{max-width:none}
.world-hero h1{font-size:32px}
.world-hero .chap{font-family:var(--display);font-weight:600;color:var(--c-ink);font-size:15px;margin-bottom:4px}
.world-hero p{margin-top:8px;color:var(--muted);font-size:15px}
.levels{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.levels li+li{border-top:1px solid var(--line)}
.level{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;min-height:64px}
.level:active{background:var(--sunk)}
.secno{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c-ink);font-variant-numeric:tabular-nums}
.level .lt{font-weight:700;line-height:1.25}
.level .ln{display:block;font-size:13px;color:var(--muted);font-weight:400}
.games{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.game{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--sunk);text-align:left;min-height:60px}
.game .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--c-ink)}
.game .gi svg{width:22px;height:22px}
.game b{display:block;font-weight:700;line-height:1.2}
.game small{display:block;color:var(--muted);font-size:13px}
.boss-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:16px;border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow);border:2px dashed hsl(var(--h) 60% 60% / .55)}
.boss-card h3{font-size:22px}
.boss-card p{color:var(--muted);font-size:14px;margin:4px 0 10px}
.boss-card .btn{min-height:44px;font-size:16px}
.boss-card.won{border-style:solid;border-color:var(--good)}
.boss-svg{width:96px;height:96px;color:var(--c-ink)}
.beaten{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700;font-size:14px;margin-bottom:8px}
.beaten svg{width:16px;height:16px}

/* ---------- quiz ---------- */
.screen.play{display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.play .col{flex:1;min-height:0;width:100%;gap:12px}
.qbar{display:flex;align-items:center;gap:10px;min-height:52px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:999px;background:var(--sunk)}
.segs i.ok{background:var(--good)}
.segs i.no{background:var(--bad)}
.segs i.now{background:var(--primary)}
.lives{display:flex;gap:2px;color:var(--accent)}
.lives svg{width:22px;height:22px}
.lives .lost{color:var(--line)}
.scope{position:relative;height:84px;border-radius:var(--r-md);background:var(--scope-bg);overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.scope canvas{position:absolute;inset:0;width:100%;height:100%}
.scope-read{position:absolute;right:10px;top:8px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.05;pointer-events:none}
.scope-read b{font-family:var(--display);font-size:24px;font-weight:800}
.scope-read span{font-size:13px;color:var(--muted)}
.scope-read em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.scope.firing .scope-read em{color:var(--accent)}
.scope-thr{position:absolute;left:10px;font-size:11px;color:var(--thr);pointer-events:none}
.qwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.qmeta{font-size:13.5px;color:var(--muted);font-weight:700}
.qtext{font-family:var(--body);font-weight:700;font-size:21px;line-height:1.32;letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;width:100%;padding:12px 14px;min-height:58px;border-radius:var(--r-md);
  background:var(--surface);box-shadow:var(--shadow);text-align:left;font-size:16.5px;line-height:1.3;transition:background .15s, transform .15s}
.opt .key{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-weight:800;color:var(--muted)}
.opt:active{transform:scale(.99)}
.opt.is-right{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good)}
.opt.is-right .key{background:var(--good);color:var(--bg)}
.opt.is-wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.is-wrong .key{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.boss-strip{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;flex:none}
.boss-strip .boss-svg{width:56px;height:56px}
.boss-strip b{font-family:var(--display);font-size:17px}
.hp{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:4px}
.hp span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.hit{animation:hit .4s ease}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-3px)}}
.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -10px 30px -12px rgba(0,0,0,.35);padding:18px var(--gut-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gut-l);
  animation:sheet .22s ease-out}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sheet.ok{box-shadow:0 -3px 0 var(--good), 0 -10px 30px -12px rgba(0,0,0,.35)}
.sheet.no{box-shadow:0 -3px 0 var(--bad), 0 -10px 30px -12px rgba(0,0,0,.35)}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict strong{font-family:var(--display);font-size:24px;font-weight:800}
.sheet.ok .verdict strong{color:var(--good)}
.sheet.no .verdict strong{color:var(--bad)}
.gain{font-weight:700;color:var(--atp);font-variant-numeric:tabular-nums}
.sheet .ans{font-size:15.5px}
.sheet .exp{color:var(--muted);font-size:15.5px;max-height:30vh;overflow-y:auto}
.floater{position:fixed;z-index:30;font-family:var(--display);font-weight:800;font-size:20px;color:var(--atp);pointer-events:none;animation:float .9s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}

/* ---------- result ---------- */
.result{align-items:center;text-align:center}
.result h1{font-size:34px}
.result .sub{color:var(--muted);margin-top:-12px}
.big-stars{display:flex;gap:6px;color:var(--atp)}
.big-stars svg{width:40px;height:40px}
.big-stars .off{color:var(--line)}
.ledger{width:100%;margin:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px 16px;text-align:left}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ledger div:last-child{border-bottom:0}
.ledger dt{color:var(--muted);font-size:15px}
.ledger dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;color:var(--atp);white-space:nowrap}
.ledger .total dt{color:var(--ink);font-weight:700}
.ledger .total dd{font-family:var(--display);font-size:20px}
.stat-row{display:flex;gap:20px;justify-content:center;color:var(--muted);font-size:15px;flex-wrap:wrap}
.stat-row b{color:var(--ink);font-variant-numeric:tabular-nums}
.misses{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.misses h2{font-size:20px}
.miss{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.miss .mq{font-weight:700}
.miss .ma{color:var(--good);font-weight:700}
.miss .me{color:var(--muted);font-size:15px}
.r-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* ---------- sprint ---------- */
.timer{flex:1;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.timer span{display:block;height:100%;background:var(--accent);border-radius:inherit;width:100%}
.score{font-family:var(--display);font-weight:800;font-size:24px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.tf-card{width:100%;min-height:240px;max-height:100%;overflow-y:auto;padding:22px 20px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;gap:12px;touch-action:pan-y;transition:background .15s}
.tf-kind{font-size:14px;color:var(--muted);font-weight:700}
.tf-text{font-size:21px;font-weight:700;line-height:1.32}
.tf-q{font-size:17px;line-height:1.35}
.tf-a{font-size:20px;font-weight:700;line-height:1.3;padding:12px 14px;border-radius:var(--r-sm);background:var(--sunk)}
.tf-card.good{background:var(--good-soft)}
.tf-card.bad{background:var(--bad-soft)}
.tf-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 0 calc(18px + env(safe-area-inset-bottom, 0px))}
.tf-btn{min-height:64px;border-radius:var(--r-md);font-family:var(--display);font-weight:800;font-size:22px}
.tf-btn.no{background:var(--bad-soft);color:var(--bad)}
.tf-btn.yes{background:var(--good-soft);color:var(--good)}
.penalty{color:var(--bad)}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.intro h2{font-size:28px}
.intro p{color:var(--muted)}

/* ---------- match & pathway ---------- */
.mgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px;align-content:start}
.mcol{display:flex;flex-direction:column;gap:8px}
.chip{min-height:56px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow);text-align:left;font-size:15px;line-height:1.25;
  transition:background .15s, opacity .2s;overflow-wrap:break-word;hyphens:auto}
.chip.L{font-weight:700;font-family:var(--display);font-size:16px}
.chip.sel{box-shadow:inset 0 0 0 2.5px var(--primary);background:var(--primary-soft)}
.chip.bound{background:var(--good-soft);color:var(--ink);box-shadow:none;opacity:.6;cursor:default}
.mstat{display:flex;gap:14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.mstat b{color:var(--ink)}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;position:relative;padding-bottom:12px}
.chain li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--good);color:var(--bg)}
.chain .t{padding-top:4px;font-weight:700;line-height:1.3}
.chain li.next .n{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.chain li.next .t{color:var(--muted);font-weight:400}
.pool{display:flex;flex-direction:column;gap:8px}
.pool .chip{width:100%}

/* ---------- badges / stats / settings ---------- */
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;
  background:radial-gradient(circle at 35% 30%, var(--mito-in), var(--mito) 120%);color:var(--mito-face);letter-spacing:-.02em}
.badge b{display:block;font-weight:700;line-height:1.2;font-size:15px}
.badge small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.badge.locked{background:var(--sunk);box-shadow:none}
.badge.locked .disc{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px 16px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:14px}
.mastery{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.mrow{--c-ink:hsl(var(--h) var(--ti-s) var(--ti-l));display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.mrow .mbar{grid-column:1 / -1;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.mrow .mbar span{display:block;height:100%;background:var(--c-ink);border-radius:inherit}
.mrow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.settings{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:60px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row small{display:block;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.about{color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:8px}

/* ---------- overlays ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top, 0px));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 var(--gut-r) 0 var(--gut-l)}
.toast{display:flex;align-items:center;gap:10px;max-width:420px;width:100%;padding:10px 14px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toast .25s ease-out}
.toast .disc{width:36px;height:36px;font-size:12px;flex:none}
.toast b{display:block;font-size:14px}
.toast span{font-size:14px;opacity:.85}
@keyframes toast{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px var(--gut-r) 20px var(--gut-l)}
.scrim{position:absolute;inset:0;background:rgba(14,11,29,.55)}
.dialog{position:relative;width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.dialog h2{font-size:24px}
.dialog p{color:var(--muted)}
.dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

/* ---------- mito ---------- */
.mito .body{fill:var(--mito)}
.mito .inner{fill:var(--mito-in)}
.mito .cristae{stroke:var(--mito-cristae);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mito .face{fill:var(--mito-face)}
.mito .facel{stroke:var(--mito-face);fill:none;stroke-width:3;stroke-linecap:round}
.mito .cheek{fill:var(--accent);opacity:.35}
.mito-wrap.bob svg{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- juice: overlays ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:44;opacity:0;background:radial-gradient(ellipse at center, transparent 40%, var(--bad) 150%)}
#flash.good{background:radial-gradient(ellipse at center, transparent 46%, var(--good) 160%)}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.65}100%{opacity:0}}
#pops{position:fixed;inset:0;pointer-events:none;z-index:46;overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:59}
.poptext{position:absolute;left:50%;top:var(--y,30%);transform:translate(-50%,-50%);width:max-content;max-width:88vw;text-align:center;
  padding:10px 20px 12px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 3px var(--c,var(--accent)),0 14px 34px -10px rgba(0,0,0,.5);
  font-family:var(--display);font-weight:800;font-size:clamp(24px,7.6vw,34px);line-height:1.05;color:var(--c,var(--accent));
  animation:popText 1.2s cubic-bezier(.2,.9,.25,1) forwards}
.poptext small{display:block;margin-top:4px;font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted)}
@keyframes popText{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-7deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(2deg)}
  28%{transform:translate(-50%,-50%) scale(.95) rotate(0)}38%{transform:translate(-50%,-50%) scale(1.02)}76%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-85%) scale(.96)}}
.dmg{position:fixed;z-index:46;pointer-events:none;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);
  text-shadow:0 2px 0 var(--bg),0 0 10px var(--bg);animation:dmg .95s cubic-bezier(.2,.9,.3,1) forwards}
.dmg.crit{font-size:38px;color:var(--atp)}
@keyframes dmg{0%{opacity:0;transform:translateY(10px) scale(.4)}18%{opacity:1;transform:translateY(-6px) scale(1.3)}32%{transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-50px)}}
.bump{animation:bump .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.32)}100%{transform:scale(1)}}
.scope-read b,.score,.mstat b,#pen,.lives>span{display:inline-block}
.qatp{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);
  color:var(--atp);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.qatp svg{width:18px;height:18px}
.qatp b{color:var(--ink)}

/* ---------- juice: tactile presses ---------- */
.btn,.mode,.game,.cta,.tf-btn,.icon-btn,.level,.chip,.field,.mito-wrap{transition:transform .1s ease, background .15s, box-shadow .15s, opacity .2s}
.btn:active,.mode:active,.game:active,.cta:active,.tf-btn:active,.icon-btn:active,.chip:active{transform:scale(.95)}
.level:active{transform:scale(.985)}
.slide:active .field{transform:scale(.93) rotate(-3deg)}

/* ---------- juice: quiz ---------- */
.qtext{animation:qIn .32s ease-out backwards}
@keyframes qIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.opt{animation:optIn .38s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--i,0) * 60ms + 60ms)}
@keyframes optIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.opt.is-right{animation:rightPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes rightPop{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
.opt.is-right .key svg{width:20px;height:20px}
.opt.shake,.chip.shake,.tf-card.shake{animation:shake .4s ease}
.segs i{transition:background .2s}
.segs i.just{animation:segPop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes segPop{0%{transform:scaleY(1)}40%{transform:scaleY(2.2)}100%{transform:scaleY(1)}}
.scope.zap{animation:zap .45s ease-out}
@keyframes zap{0%{box-shadow:inset 0 0 0 1px var(--line)}25%{box-shadow:inset 0 0 0 2px var(--accent),0 0 24px 2px var(--accent)}100%{box-shadow:inset 0 0 0 1px var(--line)}}
.verdict .mini{flex:none;display:block;margin:-8px 0 -8px -4px;animation:squash .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes squash{0%{transform:scale(.2)}40%{transform:scale(1.22,.82)}62%{transform:scale(.9,1.1)}82%{transform:scale(1.04,.97)}100%{transform:none}}
@keyframes sheet{0%{transform:translateY(100%)}68%{transform:translateY(-7px)}100%{transform:none}}
.sheet{animation-duration:.4s;animation-timing-function:cubic-bezier(.2,.9,.3,1)}

/* ---------- juice: boss ---------- */
.hp{position:relative}
.hp #hp{position:relative;z-index:1;transition:width .18s ease}
.hp .ghost{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--atp);opacity:.7;border-radius:inherit;transition:width .5s ease .32s}
.hurt svg{animation:hurt .38s ease}
@keyframes hurt{0%,100%{filter:none}25%{filter:brightness(2.4) saturate(.2)}}
.boss-dead{animation:bossDie .8s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes bossDie{0%{transform:none}22%{transform:scale(1.35) rotate(-12deg)}100%{transform:scale(0) rotate(200deg);opacity:0}}
.lives .breaking{animation:heartBreak .6s ease-in forwards}
@keyframes heartBreak{0%{transform:none}28%{transform:scale(1.6) rotate(-12deg)}100%{transform:translateY(26px) rotate(30deg) scale(.5);opacity:0}}

/* ---------- juice: sprint, match, pathway ---------- */
.tf-card.in{animation:cardIn .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cardIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:none}}
.tf-card.out-r{animation:outR .2s ease-in forwards}
.tf-card.out-l{animation:outL .2s ease-in forwards}
@keyframes outR{to{opacity:0;transform:translateX(115%) rotate(16deg)}}
@keyframes outL{to{opacity:0;transform:translateX(-115%) rotate(-16deg)}}
.tf-card.dim{opacity:.45}
.timer.hurry span{background:var(--bad);animation:hurry .5s ease-in-out infinite alternate}
@keyframes hurry{to{opacity:.45}}
.chip.err{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.chip.pick{animation:pick .22s ease}
@keyframes pick{0%{transform:scale(.93)}100%{transform:scale(1)}}
.chip.bound{animation:snap .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes snap{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.chain li.new{animation:dropIn .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:none}}

/* ---------- juice: results ---------- */
.rv{animation:revealUp .42s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d,0ms)}
@keyframes revealUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.big-stars>span{display:inline-block;animation:starPop .55s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:var(--d,0ms)}
@keyframes starPop{0%{opacity:0;transform:scale(0) rotate(-45deg)}70%{opacity:1;transform:scale(1.3) rotate(8deg)}100%{transform:none}}
.result>.mito-wrap{animation:mitoIn .65s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes mitoIn{0%{opacity:0;transform:translateY(-36px) scale(.5)}100%{opacity:1;transform:none}}
.result h1{animation:popIn .5s .12s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}

/* ---------- juice: home ---------- */
.meter span{transition:width 1s cubic-bezier(.3,.9,.3,1) .15s}
.ring-fg{transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1)}
.mito-wrap.giggle svg{animation:giggle .62s ease}
@keyframes giggle{0%{transform:none}18%{transform:scale(1.18,.82) rotate(-7deg)}38%{transform:scale(.9,1.12) rotate(6deg)}58%{transform:scale(1.06,.95) rotate(-3deg)}100%{transform:none}}
.fact.swap{animation:qIn .32s ease-out}
.toast.badge{animation:toastBadge .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastBadge{0%{opacity:0;transform:translateY(-24px) scale(.8)}100%{opacity:1;transform:none}}
.toast.badge .disc{animation:spinIn .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.3)}to{transform:none}}

/* ---------- juice: rank-up celebration ---------- */
#celebrate{position:fixed;inset:0;z-index:57;display:grid;place-items:center;padding:24px var(--gut-r) 24px var(--gut-l);background:rgba(14,11,29,.74);overflow:hidden;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#celebrate .rays{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;
  background:repeating-conic-gradient(rgba(255,200,61,.24) 0deg 9deg, transparent 9deg 18deg);
  -webkit-mask-image:radial-gradient(circle, #000 0, transparent 60%);mask-image:radial-gradient(circle, #000 0, transparent 60%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cele-card{position:relative;width:100%;max-width:360px;background:var(--surface);border-radius:var(--r-lg);padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:celeIn .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes celeIn{from{opacity:0;transform:scale(.5) rotate(-4deg)}to{opacity:1;transform:none}}
.cele-k{font-weight:700;color:var(--muted)}
.cele-rank{font-size:52px;color:var(--accent);animation:popIn .6s .25s cubic-bezier(.3,1.8,.5,1) backwards}
.cele-card .btn{margin-top:10px;min-width:180px}

/* ---------- study: status levels ---------- */
.lv-weak{--lv:var(--bad);--lv-soft:var(--bad-soft)}
.lv-shaky{--lv:var(--atp);--lv-soft:var(--atp-soft)}
.lv-solid{--lv:var(--good);--lv-soft:var(--good-soft)}
.lv-new{--lv:var(--line);--lv-soft:var(--sunk)}
.lvtxt-weak{color:var(--bad)!important;font-weight:700}
.lvtxt-shaky{color:var(--atp)!important;font-weight:700}

/* ---------- study: topic lists ---------- */
.tlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.tlist li+li{border-top:1px solid var(--line)}
.trow-main{display:grid;grid-template-columns:5px minmax(0,1fr) auto;grid-template-areas:"s t l";gap:2px 12px;align-items:center;width:100%;padding:12px 14px 12px 0;text-align:left;min-height:62px}
.trow-main:active{background:var(--sunk)}
.trow .stripe{grid-area:s;align-self:stretch;background:var(--lv);border-radius:0 4px 4px 0}
.trow .tt{grid-area:t;min-width:0}
.trow .tt b{display:block;font-weight:700;line-height:1.25}
.trow .tt small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.trow .tl{grid-area:l;justify-self:end;align-self:center;font-size:12px;font-weight:700;color:var(--lv);white-space:nowrap}
.trow.lv-new .tl{color:var(--muted)}

/* ---------- study: subsection screen ---------- */
.sec-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.sec-no{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:var(--c-ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sec-hero h1{font-size:27px}
.sec-hero p{margin-top:6px;font-size:15px}
.sec-stars{display:flex;align-items:center;gap:8px;margin-top:6px}
.sec-actions{display:flex;flex-wrap:wrap;gap:10px}
.sec-actions .btn{flex:1 1 150px}
.btn.primary .stars{color:var(--atp)}
.btn.primary .stars .off{color:currentColor;opacity:.3}
.sec-meter{padding:12px 14px;border-radius:var(--r-md);background:var(--lv-soft);font-weight:700;font-size:15px;box-shadow:inset 5px 0 0 var(--lv)}
.sec-meter.lv-new{color:var(--muted);font-weight:400}
.seg.small button{padding:6px 10px;font-size:13px}

/* ---------- study: weak spots screen ---------- */
.empty{padding:18px;border-radius:var(--r-md);background:var(--sunk);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--sunk);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg)}
.secmap{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow)}
.smrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center}
.smch{font-family:var(--display);font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.smcells{display:flex;flex-wrap:wrap;gap:6px}
.smcell{min-width:50px;height:34px;padding:0 8px;border-radius:9px;background:var(--lv-soft);box-shadow:inset 0 0 0 2px var(--lv);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.smcell.lv-new{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.smcell:active{transform:scale(.94)}
.smkey{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.smkey span{display:inline-flex;align-items:center;gap:6px}
.smkey i{width:12px;height:12px;border-radius:4px;background:var(--lv-soft);box-shadow:inset 0 0 0 2px var(--lv)}

/* ---------- study: home focus card ---------- */
.focus{display:grid;grid-template-columns:5px minmax(0,1fr);gap:2px 14px;padding:14px 16px 14px 0;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.focus::before{content:"";grid-row:1 / span 3;background:var(--lv);border-radius:0 4px 4px 0}
.focus-k{font-size:13px;font-weight:700;color:var(--lv)}
.focus-t b{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.focus-t small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.focus-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.focus-a .btn{min-height:42px;font-size:15px;padding:0 16px}

/* ---------- study: read links ---------- */
.read-link{display:inline-flex;align-items:center;align-self:flex-start;min-height:36px;padding:6px 12px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:14px;line-height:1.25;text-align:left}
.read-link::after{content:"›";flex:none;margin-left:12px;font-size:22px;line-height:1;font-weight:700}
.read-link:active{transform:scale(.97)}
.read-link .rl{display:flex;flex-direction:column;gap:1px}
.read-link .rl small{font-size:11.5px;font-weight:700;letter-spacing:.02em;opacity:.78}

/* ---------- study: end-of-round review list ---------- */
.reading{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.reading h2{font-size:20px}
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.rlist li+li{border-top:1px solid var(--line)}
.rlist button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:10px 14px;text-align:left;box-shadow:inset 4px 0 0 var(--lv)}
.rlist button:active{background:var(--sunk)}
.rlist span{min-width:0}
.rlist b{display:block;font-weight:700;line-height:1.25}
.rlist small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rlist em{font-style:normal;font-weight:700;font-size:13px;color:var(--lv);white-space:nowrap;flex:none}
.rlist .lv-new em{color:var(--muted)}

/* ---------- study: topic sheet ---------- */
#reader{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;animation:readerIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes readerIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.rd-head{display:flex;gap:6px;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 6px var(--gut-l)}
.rd-title{min-width:0;padding-top:4px}
.rd-sec{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.rd-title h2{font-size:24px;margin:2px 0 3px}
.rd-kind{display:block;font-size:13px;color:var(--primary);font-weight:700}
.rd-body{flex:1;min-height:0;overflow:auto;padding:0 var(--gut-r) 24px var(--gut-l)}
.rd-foot{padding:10px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l);border-top:1px solid var(--line);background:var(--bg)}
.notes{display:flex;flex-direction:column;gap:12px}
.notes h3{font-size:18px;margin-top:6px}
.note-status{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-md);background:var(--lv-soft);box-shadow:inset 5px 0 0 var(--lv)}
.note-status span{color:var(--muted);font-size:14px}
.kp{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.kp.missed{box-shadow:inset 4px 0 0 var(--bad),var(--shadow)}
.kp.current{box-shadow:inset 4px 0 0 var(--primary),var(--shadow)}
.kp-tag{font-size:12px;font-weight:700;color:var(--bad)}
.kp.current .kp-tag{color:var(--primary)}
.kq{font-weight:700}
.ka{color:var(--good);font-weight:700}
.ke{color:var(--muted);font-size:15px}

/* ---------- study: drill result ---------- */
.tcheck{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.tcheck h2{font-size:20px}
.tc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);font-size:15px}
.tc b{font-weight:700;min-width:0}
.tc .tl2{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.tc .tl2 .a{color:var(--muted)}
.tc .tl2 .b{color:var(--lv)}
.tc.lv-new .tl2 .b{color:var(--muted)}

/* ---------- battles ---------- */
.mode.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px;min-height:72px}
.mode.wide > span:last-child{display:flex;flex-direction:column;gap:2px}
.mode.wide b{color:var(--ink)}
.mode .bt-badge{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.bt-av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;background:hsl(var(--h) 58% 46%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.bt-av.big{width:56px;height:56px;font-size:24px}
.bt-small{min-height:38px;padding:0 14px;font-size:14px}
.bt-me{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.bt-me > div{flex:1;min-width:0}

  q: [
    ["12.1", "A person with type AB blood shows both A and B antigens fully on their red cells. This illustrates:", "Codominance", "Incomplete dominance", "Complete dominance", "Epistasis", "Both alleles are fully expressed, with no blending."],
    ["12.1", "Crossing red- and white-flowered plants yields only pink flowers, and pink × pink gives red, pink and white in a 1:2:1 ratio. This is:", "Incomplete dominance", "Codominance", "Complete dominance", "Low penetrance", "The heterozygote shows a blend that falls between the two homozygotes."],
    ["12.1", "Of 100 people who carry a disease genotype, 70 develop the disease. That 70% figure describes the gene's:", "Penetrance", "Expressivity", "Allele frequency", "Recombination frequency", "Penetrance is the share of carriers who show the phenotype at all."],
    ["12.1", "A dominant allele has 80% penetrance. What is the chance a heterozygous carrier shows the trait?", "80%", "40%", "100%", "20%", "Penetrance applies to everyone with the genotype; one copy is enough for a dominant allele."],
    ["12.1", "Siblings with the same neurofibromatosis genotype range from a few skin spots to many tumors. This is called:", "Variable expressivity", "Incomplete penetrance", "Codominance", "Genetic drift", "Expressivity describes how differently the same genotype shows up in different people."],
    ["12.1", "A man has only one copy of each X-linked gene. For those genes, he is:", "Hemizygous", "Homozygous", "Heterozygous", "Codominant", "That single allele decides his phenotype, recessive or not."],
    ["12.1", "Live harmless bacteria turned deadly after being mixed with heat-killed virulent bacteria. This revealed:", "A transforming principle", "That DNA is double-stranded", "That proteins carry genes", "Semiconservative replication", "Something from the dead cells changed the live ones heritably. Later work showed it was DNA."],
    ["12.1", "In later experiments, transformation still happened after protein was destroyed, but not after DNA was destroyed. This showed that:", "DNA is the transforming material", "Protein is the transforming material", "Both are required equally", "Neither is needed", "This was the Avery–MacLeod–McCarty experiment."],
    ["12.1", "Phages were grown with ³⁵S in one batch and ³²P in another. Inside the infected bacteria, researchers found:", "³²P-labeled DNA", "³⁵S-labeled protein", "Both labels equally", "Neither label", "Sulfur marks protein and phosphorus marks DNA. Only the DNA went in (Hershey–Chase)."],
    ["12.1", "Genes for seed color and seed shape sit on different chromosomes and are inherited separately. This follows Mendel's:", "Law of independent assortment", "Law of segregation of alleles", "Law of complete dominance", "Principle of gene linkage", "Mendel's second law. Linked genes are the exception."],
    ["12.1", "A pea plant carries one allele for purple flowers and one for white. It is:", "Heterozygous", "Homozygous dominant", "Hemizygous", "Homozygous recessive", "Two different alleles at one locus make a heterozygote."],
    ["12.2", "A point mutation changes the codon GCU to GCC. Both encode alanine. This is a:", "Silent mutation", "Missense mutation", "Nonsense mutation", "Frameshift mutation", "The genetic code is degenerate, so some base changes don't alter the protein."],
    ["12.2", "In sickle cell disease, a single base change swaps glutamate for valine. This is a:", "Missense mutation", "Silent mutation", "Nonsense mutation", "Frameshift mutation", "One amino acid replaced by another is missense."],
    ["12.2", "A mutation changes the codon UAC (tyrosine) to UAA. This is a:", "Nonsense mutation", "Missense mutation", "Silent mutation", "Frameshift mutation", "UAA is a stop codon, so the protein ends early."],
    ["12.2", "One base is inserted into codon 3 of a 300-codon gene. What is the most likely result?", "Every codon after it is misread", "Only one amino acid changes", "The protein is unchanged", "The gene moves to another chromosome", "Inserting or deleting bases in numbers other than multiples of three shifts the reading frame."],
    ["12.2", "The most common cystic fibrosis mutation deletes three bases from the CFTR gene. The protein most likely:", "Lacks one amino acid but stays in frame", "Is garbled from that point on", "Ends early at a stop codon", "Is made in double the normal amount", "Losing exactly one codon removes one amino acid without a frameshift."],
    ["12.2", "A chromosome segment breaks out, flips 180°, and reinserts in the same place. This is a(n):", "Inversion", "Translocation", "Duplication", "Deletion", "A translocation moves a segment to a different chromosome."],
    ["12.2", "In a small population, an allele's frequency swings by chance from one generation to the next. This is:", "Genetic drift", "Gene flow", "Directional selection", "Point mutation", "Drift has a bigger effect the smaller the population."],
    ["12.2", "A rare disease allele is common among descendants of a few hundred original settlers. This is the:", "Founder effect", "Hardy–Weinberg equilibrium", "Genetic leakage", "Directional selection", "A small founding group carries only a sample of the parent population's alleles."],
    ["12.2", "Genes moving from one species into another through hybrid offspring is called:", "Genetic leakage", "Genetic drift", "The founder effect", "Transduction", "Hybrids that can breed with either parent species carry genes across the species line."],
    ["12.3", "In a pedigree, every affected child has an affected parent, and males and females are affected equally. The trait is most likely:", "Autosomal dominant", "Autosomal recessive", "X-linked recessive", "Mitochondrial", "Dominant traits don't skip generations, and autosomal traits don't favor one sex."],
    ["12.3", "Both parents show a trait, but one of their children doesn't. The trait is most likely:", "Dominant, with both parents heterozygous", "Autosomal recessive, parents homozygous", "X-linked recessive, mother homozygous", "Mitochondrial, passed from the mother", "Two parents with a recessive trait can pass on only recessive alleles, so all their children would show it."],
    ["12.3", "Affected boys in a family usually have unaffected parents, and their maternal uncles are often affected too. The pattern is most likely:", "X-linked recessive", "Autosomal dominant", "Y-linked", "Mitochondrial", "Carrier mothers pass the X allele to sons; fathers never pass their X to sons."],
    ["12.3", "A muscle disease appears in all children of affected women and in no children of affected men. Its gene most likely lies in:", "Mitochondrial DNA", "The X chromosome", "An autosome", "The Y chromosome", "Mitochondria come from the egg, not the sperm."],
    ["12.3", "Two heterozygous tall pea plants (Tt) are crossed. What fraction of the offspring should be tall?", "3/4", "1/2", "1/4", "All of them", "TT, Tt, Tt and tt give a 3:1 ratio of tall to short."],
    ["12.3", "Crossing two plants heterozygous for two unlinked genes (AaBb × AaBb), what fraction of offspring shows both recessive traits?", "1/16", "1/4", "3/16", "9/16", "Each recessive phenotype appears ¼ of the time, so both: ¼ × ¼ = 1/16, the '1' in 9:3:3:1."],
    ["12.3", "In a Hardy–Weinberg population, the recessive allele has a frequency of 0.4. What fraction of people are homozygous dominant?", "36%", "16%", "48%", "60%", "p = 1 − 0.4 = 0.6, so p² = 0.36. (16% is q², and 48% is 2pq.)"],
    ["12.3", "Cystic fibrosis, a recessive disease, affects about 1 in 2,500 newborns in some populations. Roughly how many people there are carriers?", "About 1 in 25", "About 1 in 50", "About 1 in 2,500", "About 1 in 5", "q² = 1/2,500, so q = 0.02 and 2pq ≈ 2 × 0.98 × 0.02 ≈ 0.04, about 1 in 25."],
    ["12.3", "In a large, randomly mating moth population, the dark-wing allele climbs steadily for 20 generations after soot darkens the trees. Which Hardy–Weinberg condition has been broken?", "No natural selection", "Large population size", "Random mating", "No migration", "Birds spot light moths more easily on dark bark, so survival now depends on genotype. That's selection."],
    ["12.3", "Two genes on the same chromosome are separated by crossing over in 25% of gametes. How far apart are they?", "25 centimorgans", "2.5 centimorgans", "50 centimorgans", "75 centimorgans", "One map unit (centimorgan) equals 1% recombination."],
    ["12.3", "Recombination frequencies are D–E 8%, E–F 3% and D–F 11%. What is the gene order?", "D–E–F", "E–D–F", "D–F–E", "F–D–E", "The two smaller distances add up to the largest (8 + 3 = 11), so E sits in the middle."],
    ["12.3", "A mother who carries red-green color blindness (XᴮXᵇ) and a father with normal vision have a son. What is the chance he is color-blind?", "1/2", "1/4", "0", "1", "A son gets his X from his mother, and she passes the affected X half the time."],
    ["12.3", "To learn whether a purple-flowered plant is PP or Pp, you cross it with a plant that is:", "Homozygous recessive (pp)", "Homozygous dominant (PP)", "Heterozygous (Pp)", "Hemizygous for P", "If any offspring are white, the unknown parent must be Pp. This is a test cross."],
    ["12.4", "Human birth weights cluster near the middle because very small and very large babies historically survived less often. This is:", "Stabilizing selection", "Directional selection", "Disruptive selection", "Genetic drift", "Selection against both extremes keeps the trait in a narrow range."],
    ["12.4", "After years of heavy antibiotic use, nearly all bacteria in a hospital are resistant. This illustrates:", "Directional selection", "Stabilizing selection", "Disruptive selection", "Genetic leakage", "One extreme of the population is favored, so the average shifts toward it."],
    ["12.4", "On an island, birds with very small or very large beaks thrive while medium beaks fare poorly. This pattern, which can eventually split a species, is:", "Disruptive selection", "Stabilizing selection", "Directional selection", "Genetic drift", "Favoring both extremes can drive a population apart into two groups."],
    ["12.4", "Darwin's finches, descended from one ancestor, quickly diversified into many species with different diets. This is:", "Adaptive radiation", "Convergent evolution", "Genetic drift", "Stabilizing selection", "Each new species fills a different niche."],
    ["12.4", "By the biological species concept, two populations belong to the same species if they can:", "Interbreed and produce fertile offspring", "Look alike in shape and color", "Share the same habitat and niche", "Show nearly identical genome sequences", "Under this concept, the ability to interbreed is what draws the line between species."],
    ["12.4", "Sharks and dolphins share streamlined bodies despite being only distantly related. This is:", "Convergent evolution", "Divergent evolution", "Parallel evolution", "Adaptive radiation", "Similar pressures produce similar traits in unrelated lineages."],
    ["12.4", "Two closely related species on separate continents keep evolving similar traits because they face similar pressures. This is:", "Parallel evolution", "Convergent evolution", "Divergent evolution", "Genetic drift", "Parallel evolution starts from a shared ancestor; convergent evolution doesn't."],
    ["12.4", "Lions and tigers can produce ligers, but male ligers are sterile. This barrier is an example of:", "Postzygotic isolation", "Prezygotic isolation", "Genetic leakage only", "Adaptive radiation", "The barrier acts after fertilization, on the hybrid itself."],
    ["12.4", "Two frog species in the same pond never interbreed because one breeds in spring and the other in summer. This is:", "Prezygotic isolation", "Postzygotic isolation", "Hybrid inviability", "Genetic drift", "Timing differences prevent mating in the first place."],
    ["12.4", "A worker bee never reproduces but helps raise her sisters. Evolution can favor this because:", "Her relatives' reproduction counts toward her fitness", "Only offspring she produces herself count toward fitness", "Living a longer life counts as greater fitness", "Physical strength alone determines her fitness", "That's inclusive fitness: helping close relatives spreads shared genes."],
    ["12.4", "Fossils show long stretches of little change broken up by short bursts of rapid change. Which model fits?", "Punctuated equilibrium", "Phyletic gradualism", "Hardy–Weinberg equilibrium", "Stabilizing selection", "Evolution here is mostly slow, with occasional rapid bursts."],
    ["12.4", "Researchers estimate when two species split by counting differences in their DNA. This assumes:", "Differences accumulate roughly in step with time", "Each lineage changes at random, unrelated rates", "Neutral DNA never picks up mutations", "Recently split species differ the most", "That assumption is the molecular clock."],
    ["12.4", "Darwin knew traits varied but couldn't explain why. The modern synthesis identified the source of variation as:", "Mutation and recombination", "Traits acquired during life", "Spontaneous generation", "Blending of parental traits", "Neo-Darwinism joined natural selection with Mendelian genetics."]
  ],

  const stars = $$('.big-stars > span'), rows = $$('.ledger > div');
  if (!FXON()) { SFX.play(o.sound || 'win'); setTimeout(maybeRankUp, 300); return; }
  let t = 320;
  stars.forEach((s, i) => {
    s.style.setProperty('--d', t + 'ms');
    if (!s.classList.contains('off')) setTimeout(() => {
      if (!s.isConnected) return;
      const [x, y] = center(s);
      FX.burst(x, y, { n: 22, cols: [tok('--atp'), tok('--accent'), tok('--mito')], spd: [120, 380], size: [2, 4.5], g: 520, life: [0.4, 0.85] });
      FX.ring(x, y, tok('--atp'), 44, 0.4, 4); SFX.play('star', i); hap('star');
    }, t + 200);
    t += 270;
  });
  if (stars.length) t += 120;
  rows.forEach((r, i) => {
    const dd = r.querySelector('dd'), v = +dd.dataset.v, last = i === rows.length - 1;
    r.classList.add('rv'); r.style.setProperty('--d', t + 'ms'); dd.textContent = '+0';
    setTimeout(() => {
      if (!dd.isConnected) return;
      countUp(dd, 0, v, last ? 700 : 360, '+', x => SFX.play('count', x), () => {
        bump(dd);
        if (!last) { SFX.play('tick'); return; }
        SFX.play(o.sound || 'win'); hap(o.sound === 'lose' ? 'wrong' : 'star');
        const [x, y] = center(dd);
        FX.burst(x, y, { n: 16, cols: [tok('--atp')], spd: [80, 240], size: [2, 4], g: 300, life: [0.3, 0.7] });
        if (o.confetti) FX.confetti(110);
        setTimeout(maybeRankUp, 650);
      });
    }, t + 180);
    t += last ? 0 : 240;
  });
  if (!rows.length) setTimeout(maybeRankUp, t + 400);
}

function applyTheme() {
  for (const k in TOK) delete TOK[k];
  const root = document.documentElement, pref = S.set.theme;
  let mode = pref;
  if (pref === 'auto') {
    if (NB && NB.isNight) { mode = NB.isNight() ? 'dark' : 'light'; root.setAttribute('data-theme', mode); }
    else { root.removeAttribute('data-theme'); mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  } else root.setAttribute('data-theme', pref);
  const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
  const meta = $('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', bg);
  try { if (NB && NB.setBars) NB.setBars(bg, mode === 'light'); } catch (e) { }
  scope.colors();
}
window.onSystemTheme = applyTheme;

/* ================= membrane-potential scope ================= */
const scope = {
  cv: null, ctx: null, raf: 0, buf: [], v: -70, base: -70, q: [], step: 1.6, glow: 0,
  colors() {
    const cs = getComputedStyle(document.documentElement);
    this.cTrace = cs.getPropertyValue('--trace').trim() || '#000';
    this.cGrid = cs.getPropertyValue('--grid').trim() || '#ddd';
    this.cThr = cs.getPropertyValue('--thr').trim() || '#999';
    this.glow = parseFloat(cs.getPropertyValue('--glow')) || 0;
    this.font = '700 10.5px ' + getComputedStyle(document.body).fontFamily;
    if (this.ctx && reduced) this.draw();
  },
  mount(streak) {
    this.cv = $('#scopeCv'); if (!this.cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), r = this.cv.getBoundingClientRect();
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
    this.ctx = this.cv.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.base = this.baseFor(streak || 0); this.v = this.base; this.q = [];
    this.span = this.w - 92;
    const n = Math.ceil(this.span / this.step) + 2;
    this.buf = new Array(n).fill(this.base);
    this.colors(); this.label(streak || 0, null);
    if (reduced) { this.draw(); return; }
    cancelAnimationFrame(this.raf);
    const tick = () => { if (!this.cv || !this.cv.isConnected) return; this.adv(); this.draw(); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  },
  stop() { cancelAnimationFrame(this.raf); this.cv = null; this.ctx = null; },
  baseFor(s) { return s >= 3 ? -57 : -70 + 4 * s; },
  adv() {
    let y;
    if (this.q.length) { y = this.q.shift(); this.v = y; }
    else { this.v += (this.base - this.v) * 0.08; y = this.v + (Math.random() - 0.5) * 1.1; }
    this.buf.push(y); this.buf.shift();
  },
  spike() {
    const s = [], from = this.v;
    for (let i = 1; i <= 3; i++) s.push(from + (-55 - from) * i / 3);
    for (let i = 1; i <= 4; i++) s.push(-55 + 90 * i / 4);
    for (let i = 1; i <= 9; i++) s.push(35 - 117 * i / 9);
    this.q.push(...s);
  },
  hyper() { const s = []; for (let i = 1; i <= 8; i++) s.push(this.v + (-84 - this.v) * i / 8); this.q.push(...s); },
  correct(streak) { this.base = this.baseFor(streak); if (streak >= 3) { this.spike(); this.zap(streak); } this.label(streak, true); if (reduced) this.draw(); },
  zap(streak) {
    const box = $('#scope'); if (!box) return;
    bump(box, 'zap');
    if (!FXON()) return;
    const r = box.getBoundingClientRect(), n = streak === 3 || streak === 6 ? 12 : 5;
    for (let i = 0; i < n; i++) FX.add({ t: 'glyph', glyph: Math.random() < 0.7 ? 'Na\u207a' : 'K\u207a', x: r.left + 24 + Math.random() * (r.width - 140), y: r.top + 16 + Math.random() * (r.height - 32),
      vx: (Math.random() - 0.5) * 70, vy: -50 - Math.random() * 90, g: 30, r: 12 + Math.random() * 6, col: Math.random() < 0.7 ? tok('--accent') : tok('--trace'), life: 0.6 + Math.random() * 0.5 });
    FX.burst(r.left + (this.span || r.width - 92), r.top + 14, { n: 10, shape: 'spark', cols: [tok('--trace'), tok('--accent')], spd: [120, 320], size: [1.5, 3], g: 200, life: [0.25, 0.5] });
  },
  wrong() { this.base = -70; this.hyper(); this.label(0, false); if (reduced) this.draw(); },
  label(streak, ok) {
    const mv = $('#mv'), st = $('#mvState'), box = $('#scope'); if (!mv) return;
    let v = this.baseFor(streak), txt = 'Resting';
    if (ok === false) { v = -80; txt = 'Hyperpolarized'; }
    else if (streak >= 6) { v = 35; txt = 'Saltatory ×3 ATP'; }
    else if (streak >= 3) { v = 35; txt = 'Firing ×2 ATP'; }
    else if (streak > 0) txt = (3 - streak) + ' more to fire';
    const txtV = (v > 0 ? '+' : '−') + Math.abs(v);
    if (mv.textContent !== txtV) { mv.textContent = txtV; bump(mv); }
    st.textContent = txt;
    box.classList.toggle('firing', streak >= 3);
  },
  draw() {
    const c = this.ctx; if (!c) return;
    const w = this.w, h = this.h, Y = mv => h - 6 - ((mv + 92) / 134) * (h - 12);
    c.clearRect(0, 0, w, h);
    c.strokeStyle = this.cGrid; c.lineWidth = 1; c.beginPath();
    for (let x = 0.5; x < w; x += 14) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = 0.5; y < h; y += 14) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
    c.strokeStyle = this.cThr; c.setLineDash([5, 5]); c.beginPath(); c.moveTo(0, Y(-55)); c.lineTo(w, Y(-55)); c.stroke(); c.setLineDash([]);
    c.fillStyle = this.cThr; c.font = this.font; c.fillText('threshold', 8, Y(-55) - 4);
    const data = reduced ? this.buf.map(() => this.base) : this.buf;
    c.strokeStyle = this.cTrace; c.lineWidth = 2.4; c.lineJoin = 'round'; c.lineCap = 'round';
    if (this.glow) { c.shadowColor = this.cTrace; c.shadowBlur = this.glow; }
    c.beginPath();
    const off = this.span - (data.length - 1) * this.step;
    data.forEach((v, i) => { const x = off + i * this.step, y = Y(v); i ? c.lineTo(x, y) : c.moveTo(x, y); });
    c.stroke(); c.shadowBlur = 0;
    const lx = off + (data.length - 1) * this.step, ly = Y(data[data.length - 1]);
    c.fillStyle = this.cTrace; c.beginPath(); c.arc(lx, ly, 4, 0, Math.PI * 2); c.fill();
  }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(scope.raf); else if (scope.cv) scope.mount(sess ? sess.streak : 0); });

let stack = [];

function go(name, params, opts) {

  if (opts.reset) stack = [];
  stack.push({ name, params: params || {} });
  render(true);
}
function back() { if (stack.length > 1) { stack.pop(); render(true); } }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function render(animate) {
  scope.stop(); clearInterval(sprintTimer); clearTimeout(btTimer); clearInterval(btTick); closeModal();
  $$('.floater').forEach(f => f.remove());
  const top = stack[stack.length - 1];

function pickDaily() {
  const out = new Set();

  const w = BANK.map(c => ({ id: c.id, w: 1.25 - chMastery(c.id) }));
  const tot = w.reduce((a, b) => a + b.w, 0);
  let guard = 0;
  while (out.size < 10 && guard++ < 500) {
    let r = Math.random() * tot, ch = w[0].id;
    for (const x of w) { r -= x.w; if (r <= 0) { ch = x.id; break; } }
    const pool = CH[ch].ids.filter(id => !out.has(id));
    const fresh = pool.filter(id => !S.q[id] || S.q[id][2] === 0);
    const src = fresh.length && Math.random() < 0.7 ? fresh : pool;

}

    c.ids.forEach(id => {

      if (/\b(NOT|EXCEPT)\b/.test(q.text)) return;
      const truth = Math.random() < 0.5;
      items.push({ kind: 'mcq', qid: id, q: q.text, a: truth ? q.opts[0] : q.opts[1 + rnd(3)], truth, exp: 'Answer: ' + q.opts[0] + '. ' + q.exp, ch: c.id });
    });

  const tf = shuffle(items.filter(x => x.kind === 'tf')), mc = shuffle(items.filter(x => x.kind === 'mcq'));
  const out = []; while (tf.length || mc.length) { if (tf.length) out.push(tf.pop()); if (mc.length) out.push(mc.pop()); }

}

  const key = game.type + ':' + game.ch + ':' + game.i;
  S.g[key] = Math.max(S.g[key] || 0, stars);
  S.atp += gain;
  if (game.type === 'm') S.matchDone++;
  if (game.type === 's' && game.mistakes === 0) S.pathPerfect++;
  game.stars = stars; game.gain = gain; game.secs = Math.round((Date.now() - game.t0) / 1000);
  touchDay(); checkBadges(); save();
  go('gameResult', {}, { replace: true });
}

/* ================= study: topics, weak spots, drills ================= */
// Each topic is a named concept within a subsection (from content/topics.js).
const TOP = {}, TQ = {}, SECTOPICS = {};
(window.TOPICS || []).forEach(([id, title]) => {
  const sec = id.split('.').slice(0, 2).join('.');
  TOP[id] = { id, title, sec, ch: +sec.split('.')[0] };
  TQ[id] = [];
  (SECTOPICS[sec] = SECTOPICS[sec] || []).push(id);
});
Object.entries(window.QTOPIC || {}).forEach(([qid, tid]) => { if (TQ[tid]) TQ[tid].push(qid); });
const qTopic = qid => TOP[(window.QTOPIC || {})[qid]] || null;
const secTitle = sec => CH[+sec.split('.')[0]].sections[sec];

// Recent answers per question, newest last, e.g. "1101". Older saves only kept the last result.
function recentOf(id) {
  const r = S.q[id]; if (!r || !r[0]) return '';
  if (r[4]) return r[4];
  return (r[1] < r[0] && r[2] ? '0' : '') + (r[2] ? '1' : '0');
}
// 0 = solid, 1 = keeps missing it. Recent answers count most.
function qRisk(id) {
  const rec = recentOf(id); if (!rec) return null;
  let w = 1, sw = 0, sm = 0;
  for (let i = rec.length - 1; i >= 0; i--) { sw += w; if (rec[i] === '0') sm += w; w *= 0.65; }
  let risk = sm / sw;
  if (id in S.rv) risk = Math.max(risk, 0.55);
  return risk;
}
const LEVEL = {
  weak: { label: 'Needs review', rank: 3 },
  shaky: { label: 'Shaky', rank: 2 },
  solid: { label: 'Solid', rank: 1 },
  new: { label: 'Not tried yet', rank: 0 }
};
function topicStats(tid) {
  const ids = TQ[tid] || []; let seen = 0, tries = 0, misses = 0, rsum = 0, pending = 0;
  ids.forEach(id => {
    const r = S.q[id];
    if (r && r[0]) { seen++; tries += r[0]; misses += r[0] - r[1]; rsum += qRisk(id); }
    if (id in S.rv) pending++;
  });
  const risk = seen ? rsum / seen : null;
  const level = risk === null ? 'new' : risk >= 0.45 ? 'weak' : risk >= 0.18 ? 'shaky' : 'solid';
  return { tid, n: ids.length, seen, tries, misses, pending, risk, level };
}
function statLine(st) {
  if (!st.seen) return st.n === 1 ? '1 question, not tried yet' : st.n + ' questions, not tried yet';
  if (!st.misses) return st.tries === 1 ? 'Right once' : 'Right all ' + st.tries + ' times';
  if (st.tries === 1) return 'Missed it once';
  return st.misses === st.tries ? 'Missed all ' + st.tries + ' tries' : 'Missed ' + st.misses + ' of ' + st.tries + ' tries';
}
const byNeed = (a, b) => (b.risk || 0) - (a.risk || 0) || b.misses - a.misses || b.pending - a.pending;
function weakTopics(filter) {
  return Object.keys(TOP).filter(t => !filter || filter(TOP[t])).map(topicStats).filter(s => s.seen && s.risk >= 0.18).sort(byNeed);
}
function secRisk(sec) {
  const st = (SECTOPICS[sec] || []).map(topicStats).filter(s => s.seen);
  if (!st.length) return null;
  const tot = st.reduce((a, s) => a + s.seen, 0);
  return st.reduce((a, s) => a + s.risk * s.seen, 0) / tot;
}
const levelOf = r => r === null ? 'new' : r >= 0.45 ? 'weak' : r >= 0.18 ? 'shaky' : 'solid';

function pickDrill(tids, n) {
  let ids = [].concat(...tids.map(t => TQ[t] || []));
  const pr = id => (id in S.rv) ? 5 : !S.q[id] ? 2.4 : 1 + 3 * qRisk(id);
  ids = shuffle(ids).sort((a, b) => pr(b) - pr(a)).slice(0, n);
  return shuffle(ids);
}
// Thin topics borrow the next-weakest topics from the same subsection so a drill has substance.
function widen(tids, min) {
  const have = () => tids.reduce((a, t) => a + (TQ[t] || []).length, 0);
  if (have() >= min) return tids;
  const sec = TOP[tids[0]].sec;
  const more = (SECTOPICS[sec] || []).filter(t => !tids.includes(t)).map(topicStats).sort((a, b) => (b.risk === null ? -1 : b.risk) - (a.risk === null ? -1 : a.risk));
  for (const s of more) { if (have() >= min) break; tids.push(s.tid); }
  return tids;
}
function startDrill(tids, title, replace) {
  if (!tids.length) return;
  const before = {}; tids.forEach(t => { before[t] = topicStats(t).level; });
  startQuiz({ kind: 'drill', ch: TOP[tids[0]].ch, title, tids: tids.slice(), before, ids: pickDrill(tids, tids.length > 3 ? 10 : 8) }, replace);
}
function drillTopic(tid, replace) { startDrill(widen([tid], 5), TOP[tid].title, replace); }
function drillSection(sec, replace) {
  const w = weakTopics(t => t.sec === sec).map(s => s.tid);
  startDrill(w.length ? widen(w, 6) : (SECTOPICS[sec] || []).slice(), sec + ' weak spots', replace);
}
function drillWeak(replace) {
  const w = weakTopics(); const tids = []; let n = 0;
  for (const s of w) { tids.push(s.tid); n += s.n; if (n >= 12 && tids.length >= 3) break; }
  startDrill(tids, 'Your weak spots', replace);
}

const readBtn = (qid, cls) => { const t = qTopic(qid); return t ? `<button class="${cls || 'read-link'}" data-act="read" data-topic="${t.id}" data-q="${qid}"><span class="rl"><small>Review this topic</small>${esc(t.title)}</span></button>` : ''; };
// End-of-round review plan: topics behind missed questions, or a few from the round if none were missed.
function readingList(ids, missed) {

}
function topicRow(st, showSec) {

/* ================= battles: turn-based head-to-head, passed between phones as text ================= */
// A battle is best of 3 rounds. Each round is 5 questions from one chapter, and both players get the
// same questions. Turns bounce back and forth as a code inside an ordinary text message:
//   P1 picks round 1 and plays it -> P2 plays round 1, picks round 2, plays it -> P1 plays round 2,
//   picks round 3, plays it -> P2 plays round 3 and the battle is over (P2 sends the result back).
// Each phone keeps its own copy and merges whatever arrives, so nothing can be replayed or undone.

  return out;
}

  if (S.bv !== 2) {  // 1.6 stored answer times in tenths of a second
    Object.values(S.battles).forEach(b => b.s.forEach(side => side.forEach(r => { if (r) r.forEach(e => { if (e[1] > 40) e[1] = Math.round(e[1] / 5); }); })));
    S.bv = 2;
  }
  return S.battles;
}

const bPts = e => e && e[0] ? 100 + Math.round(50 * Math.max(0, 1 - e[1] / 40)) : 0;  // e = [right, half-seconds 0..40]
const rDone = a => Array.isArray(a) && a.length === BTL.Q;

function bOver(b) { return b.r.length === BTL.ROUNDS && [0, 1].every(s => b.r.every((_, i) => rDone(b.s[s][i]))); }
// What this phone's player does next: play a round, pick the next category, wait, or nothing (over).
function bNext(b) {

  if (b.r.length < BTL.ROUNDS && b.r.length % 2 === sd) return { t: 'pick', r: b.r.length };

  if (n.t === 'play') return { k: 'move', s: (b.run && b.run.r === n.r ? 'Finish round ' : 'Your turn: round ') + (n.r + 1) };
  if (n.t === 'pick') return { k: 'move', s: n.r === 0 ? 'Pick the first category' : 'Your turn: pick round ' + (n.r + 1) };
  if (n.t === 'wait' && !b.p[1]) return b.dirty ? { k: 'move', s: 'Ready to send to a friend' } : { k: 'wait', s: b.joins ? 'Open challenge, ' + b.joins + (b.joins === 1 ? ' friend' : ' friends') + ' joined' : 'Waiting for a friend to join' };
  if (n.t === 'wait' && Sync.on && b.ouid) return b.dirty ? (b.syncFail ? { k: 'move', s: 'Not sent yet. Tap to retry' } : { k: 'wait', s: 'Sending to ' + on + '…' }) : { k: 'wait', s: 'Waiting for ' + on };
  if (n.t === 'wait') return b.dirty ? { k: 'move', s: 'Ready to send to ' + on } : { k: 'wait', s: 'Waiting for ' + on };
